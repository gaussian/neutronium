name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Ruff lint
        run: uv run --all-extras ruff check neutronium/ tests/
      - name: Ruff format check
        run: uv run --all-extras ruff format --check neutronium/ tests/
      - name: Compile check
        run: uv run --all-extras python -m compileall -q neutronium/

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Run tests
        run: uv run --all-extras pytest

  # Aggregator gate — the ONLY check the branch ruleset needs to require. It
  # passes only if every job it needs succeeded. To add a check to the gate,
  # add the job here and list it in `needs` — no ruleset edit required.
  ci:
    name: ci
    needs: [lint, pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        run: |
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.pytest.result }}" = "success" ] || { echo "a required job did not succeed"; exit 1; }

name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Ruff lint
        run: uv run --all-extras ruff check neutronium/ tests/
      - name: Ruff format check
        run: uv run --all-extras ruff format --check neutronium/ tests/
      - name: Compile check
        run: uv run --all-extras python -m compileall -q neutronium/

  # Single job (not a matrix) so it reports as one stable check named "test" —
  # runs both supported Python versions as steps. Add a version by adding a step;
  # the required-check name never changes.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Test on Python 3.12
        run: uv run --python 3.12 --all-extras pytest
      - name: Test on Python 3.13
        run: uv run --python 3.13 --all-extras pytest

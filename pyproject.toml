[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "neutronium"
version = "0.2.5"
description = "Framework-agnostic Python utilities: text, time, iterables, structured logging, telemetry primitives, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
text = ["inflection"]
time = ["python-dateutil"]
memory = ["psutil"]
memory-extended = ["pympler", "objgraph"]
aws = ["boto3>=1.36", "requests>=2.23", "ec2-metadata"]
url = ["tldextract"]
requests = ["requests>=2.23", "idna"]
xpath = ["lxml"]
otel = ["opentelemetry-api"]
profiling = ["line_profiler"]

[project.urls]
Homepage = "https://github.com/gaussian/neutronium"
Issues = "https://github.com/gaussian/neutronium/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "moto>=5",
  "ruff>=0.10",
]

[tool.setuptools.packages.find]
include = ["neutronium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin to the classic real-errors rule set (pyflakes + core pycodestyle) rather
# than ruff 0.16+'s newer, broader default which pulls in style/modernization
# rules (UP/SIM/I/…). Two rules excluded:
#   F401 (imported-but-unused): fires on side-effect imports and re-exports that
#         are load-bearing despite looking unused. F821 (undefined name) still
#         catches genuinely-missing imports, so correctness is unaffected.
#   F841 (unused local): the codebase has intentional demo assignments.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

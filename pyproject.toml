[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "neutronium"
version = "0.2.1"
description = "Framework-agnostic Python utilities: text, time, iterables, structured logging, telemetry primitives, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
text = ["inflection"]
time = ["python-dateutil"]
memory = ["psutil"]
memory-extended = ["pympler", "objgraph"]
aws = ["boto3>=1.36", "requests>=2.23", "ec2-metadata"]
url = ["tldextract"]
requests = ["requests>=2.23", "idna"]
xpath = ["lxml"]
otel = ["opentelemetry-api"]
profiling = ["line_profiler"]

[project.urls]
Homepage = "https://github.com/gaussian/neutronium"
Issues = "https://github.com/gaussian/neutronium/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "moto>=5",
  "ruff>=0.10",
]

[tool.setuptools.packages.find]
include = ["neutronium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + core pycodestyle). F841 (unused local) is
# excluded — the codebase has intentional demo assignments and it is the least
# valuable rule.
ignore = ["F841"]
# Never auto-delete an "unused" import: some imports have runtime side effects or
# are re-exports. Ruff still flags them; a human/agent removes them deliberately.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# __init__.py imports are typically re-exports (public API) — leave them alone.
"__init__.py" = ["F401"]
